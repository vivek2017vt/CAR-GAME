<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ultimate 3D Car Racing</title>

    <link rel="stylesheet" href="style.css">

    <!-- Three.js 3D Engine -->
    <script
      src="https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.min.js">
    </script>
</head>

<body>

    <div id="game-container"></div>

    <div id="hud">
        <div class="game-title">🏎️ EXTREME RACING</div>

        <div class="stats">
            <div class="stat-box">
                SPEED
                <div><span id="speed">0</span> KM/H</div>
            </div>

            <div class="stat-box">
                DISTANCE
                <div><span id="distance">0</span> M</div>
            </div>
        </div>
    </div>

    <div id="start-screen" class="screen">
        <div class="panel">
            <h1>EXTREME RACING</h1>
            <p>Experience the road. Feel the speed.</p>
            <button id="start-button">START ENGINE</button>
        </div>
    </div>

    <div id="game-over" class="screen hidden">
        <div class="panel">
            <h1>GAME OVER</h1>
            <p>Your driving adventure has ended.</p>
            <button id="restart-button">RACE AGAIN</button>
        </div>
    </div>

    <div id="controls">
        <button id="left-button" aria-label="Turn left">◀</button>

        <div class="drive-buttons">
            <button id="brake-button">BRAKE</button>
            <button id="gas-button">GAS ▲</button>
        </div>

        <button id="right-button" aria-label="Turn right">▶</button>
    </div>

    <div id="help">
        PC: A / D or ← / → to steer · W to accelerate · S to brake
    </div>

    <script src="game.js"></script>

</body>
</html>
